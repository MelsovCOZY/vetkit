name: pkg-pr-new preview

# Every PR gets install-able preview builds of all packed packages, published
# from the same tarballs the release chain would ship (bun pm pack -> tarball
# checks), never from bun publish.

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # publint (inside pack) checks the dist/ files that exports/bin point at.
      - name: Build
        run: bun run build
      - name: Pack all packages
        run: bun run pack
      - name: Publish previews
        run: bunx pkg-pr-new@0.0.88 publish './dist-tarballs/*.tgz'
