name: Action selftest

# Runs the composite action at the repo root (action.yml) against fixtures/cli/run, whose
# judge is in-process and fake: no key, no network. Installs vetkit from the packed tarballs
# until a published version exists.
on:
  pull_request:

permissions:
  contents: read

jobs:
  comment-script:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Comment script tests
        run: node --test action/comment.test.mjs

  pack:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Pack
        run: bun run pack

      - name: Upload dist-tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-selftest-tarballs
          path: dist-tarballs

  selftest:
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pass
            mode: pass
            gate: 'false'
            comment: 'true'
            expect-exit: '0'
            expect-passed: '1'
            expect-failed: '0'
          - name: fail
            mode: fail
            gate: 'false'
            comment: 'true'
            expect-exit: '1'
            expect-passed: '0'
            expect-failed: '1'
          # No calibrated lock in the fixture: --gate must refuse (exit 2), and the action
          # must fail the job with that code rather than swallow it.
          - name: gate-refused
            mode: pass
            gate: 'true'
            comment: 'false'
            expect-exit: '2'
            expect-passed: '1'
            expect-failed: '0'
    name: selftest (${{ matrix.name }})
    env:
      VETKIT_FIXTURE_MODE: ${{ matrix.mode }}
      VETKIT_FIXTURE_KEY: sk-fake-selftest-0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download dist-tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-selftest-tarballs
          path: dist-tarballs

      - name: Run the action
        id: vet
        continue-on-error: true
        uses: ./
        with:
          config: fixtures/cli/run/vetkit.config.ts
          gate: ${{ matrix.gate }}
          comment: ${{ matrix.comment }}
          comment-id: ${{ matrix.name }}
          tarballs: dist-tarballs
          artifact-name: vet-junit-${{ matrix.name }}
          node-version: 22

      - name: Assert outputs
        env:
          OUTCOME: ${{ steps.vet.outcome }}
          EXIT_CODE: ${{ steps.vet.outputs.exitCode }}
          PASSED: ${{ steps.vet.outputs.passed }}
          FAILED: ${{ steps.vet.outputs.failed }}
          UNSCORED: ${{ steps.vet.outputs.unscored }}
          EXPECT_EXIT: ${{ matrix.expect-exit }}
          EXPECT_PASSED: ${{ matrix.expect-passed }}
          EXPECT_FAILED: ${{ matrix.expect-failed }}
        run: |
          set -eu
          echo "outcome=$OUTCOME exitCode=$EXIT_CODE passed=$PASSED failed=$FAILED unscored=$UNSCORED"
          fail() { echo "::error::$1"; exit 1; }
          [ "$EXIT_CODE" = "$EXPECT_EXIT" ] || fail "exitCode $EXIT_CODE, expected $EXPECT_EXIT"
          if [ "$EXPECT_EXIT" = "0" ]; then
            [ "$OUTCOME" = "success" ] || fail "action outcome $OUTCOME, expected success"
          else
            [ "$OUTCOME" = "failure" ] || fail "action outcome $OUTCOME, expected failure"
          fi
          if [ -n "$EXPECT_PASSED" ]; then
            [ "$PASSED" = "$EXPECT_PASSED" ] || fail "passed $PASSED, expected $EXPECT_PASSED"
            [ "$FAILED" = "$EXPECT_FAILED" ] || fail "failed $FAILED, expected $EXPECT_FAILED"
            [ "$UNSCORED" = "0" ] || fail "unscored $UNSCORED, expected 0"
            [ -s vet-junit.xml ] || fail "vet-junit.xml was not written"
          fi
          if grep -rqF "$VETKIT_FIXTURE_KEY" vet-junit.xml .vet 2>/dev/null; then
            fail "the fixture key leaked into the action's files"
          fi

      # The badge travels in the same artifact as the reports: download what the action uploaded
      # and compare, so a badge that is written but not uploaded fails here.
      - name: Download the uploaded reports
        if: matrix.expect-passed != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vet-junit-${{ matrix.name }}
          path: uploaded-reports

      # The badge says the calibration state and the gate result. A pass rate must never appear;
      # the one ratio allowed is the calibrated count, which is stripped before the search.
      - name: Assert the badge
        if: matrix.expect-passed != ''
        run: |
          set -eu
          fail() { echo "::error::$1"; exit 1; }
          [ -s .vet/badge.json ] || fail ".vet/badge.json was not written"
          jq -e '.schemaVersion == 1 and .label == "vetkit" and (.message|type=="string") and (.color|type=="string")' .vet/badge.json >/dev/null ||
            fail ".vet/badge.json is not a shields endpoint badge"
          message="$(jq -r '.message | gsub("[0-9]+/[0-9]+ calibrated"; "")' .vet/badge.json)"
          if grep -Eq '%|[0-9]+ */ *[0-9]+|passed' <<<"$message"; then
            fail "the badge message holds a pass rate: $message"
          fi
          cmp -s .vet/badge.json uploaded-reports/.vet/badge.json ||
            fail "the uploaded artifact does not hold the badge that vet run wrote"

      # The comment is the composite action's last word to the PR: assert its text through the
      # API. Fork PRs get a read-only token, so they neither post nor assert.
      - name: Assert the PR comment
        if: matrix.comment == 'true' && github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          set -eu
          fail() { echo "::error::$1"; exit 1; }
          body="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- vetkit-report:'"$MATRIX_NAME"' -->")) | .body')"
          [ -n "$body" ] || fail "no sticky comment with id $MATRIX_NAME on PR $PR_NUMBER"
          has() { grep -qF -- "$1" <<<"$body" || fail "comment $MATRIX_NAME lacks: $1"; }
          if [ "$MATRIX_NAME" = "pass" ]; then has '### vetkit: passed'; else has '### vetkit: failed'; fi
          has 'thresholds uncalibrated: run vet validate'
          has 'pinned: false —'
          has 'actions/runs/'
          if grep -qF -- "$VETKIT_FIXTURE_KEY" <<<"$body"; then fail "the fixture key leaked into the comment"; fi

      # `vet` is on PATH from the action's install step. A step's summary file is its own, so the
      # summary is written and read here, by running vet directly.
      - name: Assert annotations and summary
        if: matrix.expect-passed != ''
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -u
          fail() { echo "::error::$1"; exit 1; }
          : >"$GITHUB_STEP_SUMMARY"
          set +e
          vet run --config fixtures/cli/run/vetkit.config.ts --json >/dev/null 2>stderr.txt
          set -e
          if [ "$MODE" = "fail" ]; then
            grep -q '^::error' stderr.txt || fail "no ::error annotation on stderr in fail mode"
          elif grep -q '^::error' stderr.txt; then
            fail "unexpected ::error annotation on stderr in pass mode"
          fi
          [ -s "$GITHUB_STEP_SUMMARY" ] || fail "the job summary is empty"
          if grep -qF -- "$VETKIT_FIXTURE_KEY" "$GITHUB_STEP_SUMMARY" stderr.txt; then
            fail "the fixture key leaked into the summary or annotations"
          fi

  # The baseline cache key must follow the suite: a new case or a config edit gives a new key.
  baseline-key:
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    name: selftest (baseline-key)
    env:
      VETKIT_FIXTURE_MODE: pass
      VETKIT_FIXTURE_KEY: sk-fake-selftest-0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download dist-tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-selftest-tarballs
          path: dist-tarballs

      - name: Run the action (a)
        id: a
        uses: ./
        with:
          config: fixtures/cli/run/vetkit.config.ts
          config-files: fixtures/cli/run/vetkit.config.*
          comment: 'false'
          tarballs: dist-tarballs
          artifact-name: vet-junit-baseline-a
          node-version: 22

      - name: Add a case
        run: |
          printf '%s\n' '{"id":"case-2","input":{"state":"User: thanks\nAssistant: You are welcome."},"provenance":null,"tags":[]}' >>fixtures/cli/run/evals/cases/cases.jsonl

      - name: Run the action (b)
        id: b
        uses: ./
        with:
          config: fixtures/cli/run/vetkit.config.ts
          config-files: fixtures/cli/run/vetkit.config.*
          comment: 'false'
          tarballs: dist-tarballs
          artifact-name: vet-junit-baseline-b
          node-version: 22

      - name: Edit the config
        run: |
          printf '%s\n' '// selftest edit' >>fixtures/cli/run/vetkit.config.ts

      - name: Run the action (c)
        id: c
        uses: ./
        with:
          config: fixtures/cli/run/vetkit.config.ts
          config-files: fixtures/cli/run/vetkit.config.*
          comment: 'false'
          tarballs: dist-tarballs
          artifact-name: vet-junit-baseline-c
          node-version: 22

      - name: Assert the baseline key changes
        env:
          KEY_A: ${{ steps.a.outputs.baseline-key }}
          KEY_B: ${{ steps.b.outputs.baseline-key }}
          KEY_C: ${{ steps.c.outputs.baseline-key }}
        run: |
          set -eu
          fail() { echo "::error::$1"; exit 1; }
          echo "a=$KEY_A b=$KEY_B c=$KEY_C"
          [ -n "$KEY_A" ] || fail "the baseline key is empty"
          [ "$KEY_A" != "$KEY_B" ] || fail "the key did not change after a case was added"
          [ "$KEY_B" != "$KEY_C" ] || fail "the key did not change after the config was edited"
