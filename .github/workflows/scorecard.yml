name: Scorecard

# OpenSSF Scorecard supply-chain audit. The analysis job runs only once the
# repository is public (human checklist step 1): while it is private the job is
# skipped, so the workflow stays green and nothing is published.

on:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [master]
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
