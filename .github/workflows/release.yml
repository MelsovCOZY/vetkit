name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version Packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # pr-title.yml checks every PR title as a conventional commit; the default
      # "Version Packages" would fail it.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          version: bun run version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    needs: version
    # Opt-in: with no pending changesets this condition is also true on every ordinary push
    # to master, so publishing additionally needs the repository variable RELEASE_PUBLISH=true.
    if: >-
      vars.RELEASE_PUBLISH == 'true' &&
      needs.version.outputs.hasChangesets == 'false' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >=11.5.1; the runner image ships older.
      - run: npm i -g npm@latest

      - run: bun install --frozen-lockfile

      - name: Preflight (npm version, bun.lock version sync)
        run: bun scripts/release-preflight.ts

      # publint (inside pack) checks the dist/ files that exports/bin point at.
      - name: Build
        run: bun run build

      - name: Pack
        run: bun run pack

      - name: Preflight (packed tarball contents)
        run: bun scripts/release-preflight.ts --tarballs dist-tarballs

      - name: Release check
        run: bun scripts/release-check.ts dist-tarballs

      - name: Publish tarballs (dependency order, idempotent)
        run: |
          set -euo pipefail
          bun scripts/release-preflight.ts --publish-order | while IFS=$'\t' read -r _ name version tgz; do
            tgzPath="dist-tarballs/${tgz}"
            if [ ! -f "$tgzPath" ]; then
              continue
            fi
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "skip ${name}@${version} (already published)"
              continue
            fi
            npm publish "$tgzPath" --provenance --access public
          done

  # Runs only after a successful publish. Package tags (name@version) come from changesets;
  # the per-version release and the moving major tag live in a separate namespace (v<version>, v<major>).
  action-tag:
    name: Tag release
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # The tarballs attached to the release are packed again here from the commit the publish
      # job released, before any tag is pushed, so a pack failure leaves nothing behind.
      - name: Build
        run: bun run build

      - name: Pack
        run: bun run pack

      - name: Tag packages (changeset git-tag, idempotent)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [ -z "$(git tag -l "vetkit@${VERSION}")" ]; then bunx changeset git-tag; fi
          git push origin --tags

      # The notes are the released version's section of the changelog changesets writes for the
      # vetkit package; before the first versioned release there is no changelog, so the notes
      # fall back to the bare version. Releases are immutable once published, so the tarballs go
      # in the same create call. actions/attest-build-provenance is not run here: this job is
      # audited to hold contents: write only, and the id-token and attestations write scopes the
      # action needs are not granted; npm publish --provenance already signs each tarball on the
      # registry.
      - name: Release and major tag (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          MAJOR=${VERSION%%.*}
          CHANGELOG=packages/cli/CHANGELOG.md
          NOTES="$RUNNER_TEMP/release-notes.md"
          : >"$NOTES"
          if [ -f "$CHANGELOG" ]; then
            awk -v v="$VERSION" 'BEGIN { h = "## " v } $0 == h { p = 1; next } /^## / { p = 0 } p' "$CHANGELOG" >"$NOTES"
          fi
          if [ ! -s "$NOTES" ]; then printf 'vetkit %s\n' "$VERSION" >"$NOTES"; fi
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --target "$GITHUB_SHA" --title "vetkit $VERSION" --notes-file "$NOTES" dist-tarballs/*.tgz
          git tag -f "v$MAJOR" "$GITHUB_SHA"
          git push --force origin "refs/tags/v$MAJOR"
