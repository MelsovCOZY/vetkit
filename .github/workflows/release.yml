name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version Packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          version: bun run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    needs: version
    # Opt-in: with no pending changesets this condition is also true on every ordinary push
    # to master, so publishing additionally needs the repository variable RELEASE_PUBLISH=true.
    if: >-
      vars.RELEASE_PUBLISH == 'true' &&
      needs.version.outputs.hasChangesets == 'false' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >=11.5.1; the runner image ships older.
      - run: npm i -g npm@latest

      - run: bun install --frozen-lockfile

      - name: Preflight (npm version, bun.lock version sync)
        run: bun scripts/release-preflight.ts

      # publint (inside pack) checks the dist/ files that exports/bin point at.
      - name: Build
        run: bun run build

      - name: Pack
        run: bun run pack

      - name: Preflight (packed tarball contents)
        run: bun scripts/release-preflight.ts --tarballs dist-tarballs

      - name: Publish tarballs (dependency order, idempotent)
        run: |
          set -euo pipefail
          bun scripts/release-preflight.ts --publish-order | while IFS=$'\t' read -r _ name version tgz; do
            tgzPath="dist-tarballs/${tgz}"
            if [ ! -f "$tgzPath" ]; then
              continue
            fi
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "skip ${name}@${version} (already published)"
              continue
            fi
            npm publish "$tgzPath" --provenance --access public
          done
