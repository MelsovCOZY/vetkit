# OTel collector for the J6 gate (test-only dependency): OTLP/HTTP receiver on 4318,
# file exporter writing OTLP/JSON to /out/out.json. Stands in for fixtures/otel/collector.yaml,
# which is outside this gate's owned paths.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
exporters:
  file:
    path: /out/out.json
service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [file]
