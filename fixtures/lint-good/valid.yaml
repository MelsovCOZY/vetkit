criteria:
  - id: answers-question
    type: boolean
    instructions: Does the reply directly answer the user's question?
    escape: The reply is empty.
    polarity: pass_when_true
    channel: outcome
    provenance:
      traceIds: [trace-1]
  - id: profanity
    type: boolean
    instructions: Does the reply contain profanity?
    escape: The reply is unreadable.
    polarity: pass_when_false
    channel: safety
    provenance:
      traceIds: [trace-2]
  - id: tone
    type: choice
    instructions: Which tone does the reply take?
    criteria:
      polite: The reply is courteous.
      neutral: The reply is matter-of-fact.
      rude: The reply is dismissive.
    passWhen: [polite, neutral]
    escape: The reply has no discernible tone.
    polarity: pass_when_true
    channel: quality
    provenance:
      traceIds: [trace-3]
  - id: helpfulness
    type: score
    instructions: How helpful is the reply?
    criteria: [unhelpful, somewhat helpful, very helpful]
    polarity: pass_when_true
    channel: quality
    provenance:
      traceIds: []
